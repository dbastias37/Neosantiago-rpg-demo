<svg id="network" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 704" aria-label="Mapa de refugios y rutas"><style>text{font-family:var(--font-ui);fill:var(--paper)}.sub{font-family:var(--font-ui);font-size:11px;fill:#9ba89b;letter-spacing:1px}.tiny{font-family:var(--font-ui);font-size:10px;fill:#829084;letter-spacing:1px}.muted{fill:#748075}.station{fill:#0b1510;stroke:#c1c8b7;stroke-width:2.5}.route{fill:none;stroke-linejoin:round;stroke-linecap:round;stroke-width:4}.label{font-size:16px;font-weight:600;letter-spacing:.4px}.back{paint-order:stroke;stroke:#0c140f;stroke-width:7;stroke-linejoin:round}</style><defs><pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V9" stroke="#b36753" stroke-opacity=".25" stroke-width="2"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="5"/></filter></defs>
