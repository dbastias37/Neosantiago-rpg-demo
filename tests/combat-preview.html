<!doctype html>
<html lang="es">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NeoSantiago · revisión aislada de combate</title>
<style>body{margin:0;background:#171b1a;color:#e7e2d8;font:14px Arial}header{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:8px}button,select{padding:6px}p{margin:0}iframe{display:block;width:1280px;height:720px;border:1px solid #75d3d7;margin:auto}</style>
<header><button id="fight">Combate de prueba</button><button id="loot">Saqueo de prueba</button><label>Tamaño <select id="size"><option value="1280,720">1280 × 720</option><option value="360,640">360 × 640</option><option value="844,390">844 × 390</option></select></label><p id="status">Prueba aislada: no usa ni modifica tu partida.</p></header>
<!-- No same-origin permission: the real save is inaccessible even if fixture setup fails. -->
<iframe id="preview" sandbox="allow-scripts" title="Combate aislado de prueba"></iframe>
<script>
const frame=document.getElementById('preview');let source='';
document.getElementById('size').onchange=e=>{const [w,h]=e.target.value.split(',');frame.style.width=w+'px';frame.style.height=h+'px'};
function show(loot){
 if(!source)return;
 const isolation='<script>Object.defineProperty(window,"localStorage",{value:(()=>{const m=new Map();return {getItem:k=>m.get(k)||null,setItem:(k,v)=>m.set(k,String(v)),removeItem:k=>m.delete(k),clear:()=>m.clear()}})()});<\/script>';
 const setup='<script>gameSessionActive=true;state.introCompleted=true;document.querySelectorAll(".overlay,.title-screen").forEach(n=>n.classList.add("hidden"));state.party.forEach(p=>p.hunger=100);startCombat({title:"Contacto en el túnel · prueba",enemies:["merodeador","drone"],canFlee:true},{label:"Prueba aislada",_decisionChanges:[]});'+(loot?'battleState.enemies.forEach(e=>e.hp=0);beginLootPhase();battleState.looter=0;var sample=battleState.enemies[0];sample.looted=true;sample.loot=[{id:"food",qty:2,status:"pending"},{id:"scrap",qty:1,status:"pending"},{id:"ammo9",qty:3,status:"pending"}];renderBattle();renderLootModal(0);':'')+'<\/script>';
 const base='<base href="'+new URL('../',location.href).href+'">';
 frame.srcdoc=source.replace(/<head>/i,'<head>'+base+isolation).replace(/<\/body>/i,setup+'</body>');
}
document.getElementById('fight').onclick=()=>show(false);
document.getElementById('loot').onclick=()=>show(true);
fetch('../neosantiago-demo.html').then(r=>{if(!r.ok)throw Error(r.status);return r.text()}).then(s=>{source=s;show(false)}).catch(()=>document.getElementById('status').textContent='No se pudo cargar la prueba. Recarga esta página.');
</script>
</html>
