<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 885" role="img" aria-label="Lira, merodeadora exiliada">
  <defs>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency=".78" numOctaves="2" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
